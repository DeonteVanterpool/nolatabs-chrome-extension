name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Rust
      run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

    - name: Install Wasm-Pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Build Firefox
      run: |
        npm ci --legacy-peer-deps
        npm run build:firefox
        mkdir -p output
        ( cd dist/firefox && zip -r -X "$GITHUB_WORKSPACE/output/firefox.zip" . -x '*.DS_Store' )

    - name: Build Chrome
      run: |
        npm ci --legacy-peer-deps
        npm run build:chrome
        ( cd dist/chrome && zip -r -X "$GITHUB_WORKSPACE/output/chrome.zip" . -x '*.DS_Store' )

    - name: Create New Tag
      id: createNewTag
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: anothrNick/github-tag-action@1.75.0
      env:
        GITHUB_TOKEN: ${{ secrets.BUNDLE_GIT_TOKEN }}
        WITH_V: true
        DRY_RUN: false

    - name: Release
      uses: softprops/action-gh-release@v3
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.BUNDLE_GIT_TOKEN }}
      with:
        tag_name: ${{ steps.createNewTag.outputs.new_tag }}
        files: |
          output/firefox.zip
          output/chrome.zip
