[package]
name = "crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
lazy_static = "1.5.0"
openmls = { git = "https://github.com/openmls/openmls", features = ["js", "draft-ietf-mls-pq-ciphersuites"] } # need github to get post quantum cipher suites
openmls_basic_credential = { git = "https://github.com/openmls/openmls", features=["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", features=["draft-ietf-mls-pq-ciphersuites"] }
wasm-bindgen = "0.2.104"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen-test = "0.3.55"
tls_codec = "0.4.2"
oxicode = "0.2.4"
argon2 = "0.5.3"
zeroize = "1.9.0"
once_cell = "1.21.4"
aes-gcm = "0.11.0"

[lib]
crate-type = ["cdylib"]
